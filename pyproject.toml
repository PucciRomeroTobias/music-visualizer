[project]
name = "music-graph"
version = "0.1.0"
description = "Music data graph from playlist co-occurrence and similarity"
requires-python = ">=3.11"
dependencies = [
    "igraph>=0.11.8",
    "leidenalg>=0.10.2",
    "spotipy>=2.23",
    "sqlmodel>=0.0.16",
    "networkx>=3.2",
    "typer>=0.9",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "rapidfuzz>=3.5",
    "musicbrainzngs>=0.7",
    "requests>=2.33.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "tomli>=2.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.3",
    "ruff>=0.12",
]

[project.scripts]
music-graph = "music_graph.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/music_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
